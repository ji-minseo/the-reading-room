name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Localize artwork references
        run: |
          find . -type f \( -name '*.html' -o -name '*.css' -o -name '*.mjs' -o -name '*.js' \) -not -path './.git/*' -print0 \
            | xargs -0 sed -i 's#https://pickacard.everytinytool.com/artwork#/artwork#g'
          if grep -R "https://pickacard.everytinytool.com/artwork" --include='*.html' --include='*.css' --include='*.mjs' --include='*.js' . --exclude-dir=.git; then
            echo "Remote artwork reference remains after localization."
            exit 1
          fi

      - name: Configure Pages
        uses: actions/configure-pages@v5

      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
